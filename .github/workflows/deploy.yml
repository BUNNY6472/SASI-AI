name: Deploy to Cloud Run

# Deploys the exact main commit after all jobs in CI succeed. Uses keyless Workload Identity Federation:
# no Google key file is stored in GitHub. Run deploy/setup-gcp.sh once first.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'sasi-511906' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: sasi
  REPOSITORY: sasi

jobs:
  eligibility:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tested_sha: ${{ steps.commit.outputs.tested_sha }}
    steps:
      - name: Select successful CI commit still at main
        id: commit
        uses: actions/github-script@v7
        with:
          script: |
            const tested = context.payload.workflow_run.head_sha;
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.data.commit.sha !== tested) {
              core.notice('Skipping superseded CI commit; a newer main commit must pass its own CI.');
              return;
            }
            core.setOutput('tested_sha', tested);

  deploy:
    needs: eligibility
    if: ${{ needs.eligibility.outputs.tested_sha != '' }}
    runs-on: ubuntu-latest
    env:
      TESTED_SHA: ${{ needs.eligibility.outputs.tested_sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.eligibility.outputs.tested_sha }}
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${TESTED_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          # Model API keys are read by the app from Secret Manager; they are entered on its Connections page.
          SECRETS="APP_ACCESS_CODE=APP_ACCESS_CODE:latest,SESSION_SECRET=SESSION_SECRET:latest"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "sasi-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --no-cpu-throttling \
            --max-instances 1 \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 80 \
            --timeout 3600 \
            --update-env-vars "STORAGE_BACKEND=bigquery,KEY_STORE=secretmanager,GCP_PROJECT=${PROJECT_ID},BIGQUERY_DATASET=sasi_data,UPLOAD_BUCKET=${PROJECT_ID}-uploads,MAX_OUTPUT_TOKENS_PER_CALL=64000,ERIS_MAX_OUTPUT_TOKENS_PER_CALL=64000,VERTEX_AI=true,VERTEX_CLAUDE_ENABLED=false,ALLOW_CLAUDE_API_KEY=true,TRIAL_CREDITS_ONLY=true,TRIAL_CREDIT_EXPIRES_AT=2026-11-18T00:00:00Z,REQUIRE_ACCESS_TOKEN=true,ALLOW_SIMULATED=false,OPEN_MODELS=glm+deepseek+qwen+kimi+minimax+gptoss,MAX_CONCURRENT_RUNS=1,MAX_MODEL_CALLS_PER_RUN=300,MAX_TOKENS_PER_RUN=5000000,ERIS_MAX_TOKENS_PER_RUN=5000000,PROVIDER_REQUEST_TIMEOUT_SECONDS=900,RUN_TIME_LIMIT_MINUTES=120,MAX_TOTAL_RUN_MINUTES=120,MODEL_PHASE_MIN_MINUTES=20,MODEL_PHASE_GRACE_MINUTES=5" \
            --update-secrets "$SECRETS"

      - name: Show URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          echo "Deployed: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
